version: 2

unit_tests:
  # No `format` and no column types. On Athena this is the query-schema path:
  # the driver describes `... where false limit 0` instead of a zero-row Hive CTAS.
  - name: stg_orders_drops_cancelled
    model: stg_orders
    given:
      - input: ref('raw_orders')
        rows:
          - {order_id: 1, customer_id: 10, status: placed, amount_cents: 100, order_date: "2024-01-15"}
          - {order_id: 2, customer_id: 11, status: cancelled, amount_cents: 50, order_date: "2024-01-16"}
      - input: ref('raw_customers')
        rows:
          - {customer_id: 10, customer_name: ada}
          - {customer_id: 11, customer_name: grace}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, customer_name: ada, status: placed, amount_cents: 100, order_date: "2024-01-15"}
